name: Market Alert (VIX / Circuit Breaker Check)

# GitHub 자체 cron(schedule)은 삭제했습니다.
# 매일 08:00 KST 실행은 외부 스케줄러(cron-job.org)가 workflow_dispatch로 호출합니다.
on:
  workflow_dispatch: {}   # 외부 스케줄러 호출 + Actions 탭 수동 실행용

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시장 상태 체크 및 텔레그램 알림
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_alert.py
