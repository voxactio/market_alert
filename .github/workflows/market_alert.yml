name: Market Alert (VIX / Circuit Breaker Check)

on:
  schedule:
    # 매일 08:00 KST = UTC 전날 23:00 → 정기 체크(조건 충족 시에만 알림)
    - cron: "0 23 * * *"
    # 매월 1일 09:00 KST = UTC 1일 00:00 → 무조건 테스트 알림 발송
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "수동 실행 모드 선택"
        required: false
        default: "check"
        type: choice
        options:
          - check          # 평소처럼 조건 충족 시에만 알림
          - monthly_test   # 조건과 상관없이 테스트 알림 강제 발송

jobs:
  check-market:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 시장 상태 체크 및 텔레그램 알림
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 어떤 스케줄로 실행됐는지 스크립트에 전달 (매월 테스트 여부 판단용)
          TRIGGER_CRON: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ github.event.inputs.mode }}
        run: python market_alert.py
